<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sarthak Mehta</title>

    <meta name="description" content="Get in touch with Sarthak Mehta for opportunities and collaborations.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">
        Skip to Main Content
    </a>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                If you would like to connect with me regarding projects,
                internships, or opportunities, please fill out the form below.
            </p>

            <form action="#" method="post" aria-label="Contact Form">

                <fieldset>

                    <legend>Contact Information</legend>

                    <div>
                        <label for="name">Full Name</label><br>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            autocomplete="name">
                    </div>

                    <br>

                    <div>
                        <label for="email">Email Address</label><br>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                            aria-describedby="email-help">

                        <small id="email-help">
                            

                    <br>

                    <div>
                        <label for="subject">Subject</label><br>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required>
                    </div>

                    <br>

                    <div>
                        <label for="message">Message</label><br>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required></textarea>
                    </div>

                    <br>

                    <button type="submit">
                        Send Message
                    </button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Sarthak Mehta. All Rights Reserved.</p>
    </footer>

</body>
</html>
